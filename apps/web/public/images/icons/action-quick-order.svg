<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56" fill="none">
  <defs>
    <linearGradient id="cartBg" x1="10" y1="12" x2="46" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="sheetBg" x1="22" y1="8" x2="44" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="cartShadow" x="4" y="6" width="48" height="46" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Cart Body with subtle shadow -->
  <g filter="url(#cartShadow)">
    <!-- Cart Handle & Basket Basket Wire -->
    <path d="M9 13H14L18.5 32H39L44 19H19" stroke="url(#cartBg)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M21 25H41.5" stroke="url(#cartBg)" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Wheels -->
    <circle cx="21" cy="41" r="3.5" fill="#0F172A"/>
    <circle cx="21" cy="41" r="1.5" fill="#E2E8F0"/>
    <circle cx="37" cy="41" r="3.5" fill="#0F172A"/>
    <circle cx="37" cy="41" r="1.5" fill="#E2E8F0"/>
  </g>

  <!-- Floating Minimalist Spreadsheet / Excel Badge -->
  <g transform="translate(23, 7)">
    <rect x="0" y="0" width="20" height="22" rx="3.5" fill="url(#sheetBg)" stroke="#FFFFFF" stroke-width="1.2"/>
    <!-- Spreadsheet Grid Lines -->
    <line x1="4" y1="6" x2="16" y2="6" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="4" y1="11" x2="16" y2="11" stroke="#A7F3D0" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="4" y1="16" x2="16" y2="16" stroke="#A7F3D0" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="10" y1="6" x2="10" y2="19" stroke="#A7F3D0" stroke-width="1.2"/>
    <!-- Fast Lightning Icon Badge -->
    <circle cx="18" cy="19" r="5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1"/>
    <path d="M17.5 16L16 19.5H19L17.5 22.5L21 19H18.5L19.5 16H17.5Z" fill="#FFFFFF"/>
  </g>
</svg>

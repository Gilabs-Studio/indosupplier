<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56" width="56" height="56" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="14" y1="6" x2="42" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="crestHighlight" x1="28" y1="6" x2="28" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shieldShadow" x="6" y="4" width="44" height="48" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#047857" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Shield Shape with Shadow -->
  <g filter="url(#shieldShadow)">
    <path d="M28 7L42 12V25C42 35 35 43.5 28 47C21 43.5 14 35 14 25V12L28 7Z" fill="url(#shieldGrad)"/>

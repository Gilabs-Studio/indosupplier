    <!-- Outer Rim -->
    <path d="M28 8.2L40.8 12.8V25C40.8 34.2 34.4 42.1 28 45.4C21.6 42.1 15.2 34.2 15.2 25V12.8L28 8.2Z" stroke="#A7F3D0" stroke-width="1" stroke-opacity="0.6"/>
  </g>

  <!-- Verified Checkmark -->
  <path d="M22 26.5L26.5 31L35 21" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>

